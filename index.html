    <style>
      :root {

      .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

      /* ---------- header ---------- */

      /* ---------- sections & toolbars ---------- */
      section.block { padding-top: 76px; }
      .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
      .section-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; }

      .card-price { font-size: 16px; font-weight: 600; color: var(--text); }

      footer.site { margin-top: 80px; border-top: 1px solid var(--line); padding: 48px 0 148px; }
      .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 32px; }
      .footer-brand p { font-size: 14px; color: var(--text-3); margin-top: 14px; max-width: 260px; }
      .footer-col h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
      .footer-col li { margin-bottom: 10px; }
      .footer-col a { font-size: 14px; color: var(--text-2); transition: color 150ms var(--ease); }
      .footer-col a:hover { color: var(--text); }
      .footer-base { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-3); }

      /* ---------- player bar + waveform + A-B loop ---------- */
      .player {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
        background: rgba(16, 18, 28, 0.94);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-top: 1px solid var(--line-strong);
        transform: translateY(100%); transition: transform 240ms var(--ease);
      }
      .player.show { transform: translateY(0); }
      .player-in { max-width: 1180px; margin: 0 auto; padding: 10px 24px 12px; display: flex; flex-direction: column; gap: 8px; }
      .player-top { display: flex; align-items: center; gap: 14px; }
      .player-cover { width: 46px; height: 46px; border-radius: 9px; overflow: hidden; flex-shrink: 0; border: 1px solid var(--line); }
      .player-info { min-width: 0; width: 195px; }
      .player-title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .player-artist { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .player-mid { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
      .player-time { font-size: 12px; color: var(--text-3); width: 42px; }
      .player-time.right { text-align: right; }
      .wave-wrap { flex: 1; height: 34px; position: relative; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
      #wave-canvas { width: 100%; height: 100%; display: block; }
      .player-tag { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }

      .player-ab {
        display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
        padding-top: 6px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-2);
      }
      .ab-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .ab-group input[type="range"] { width: 88px; accent-color: var(--accent); cursor: pointer; }
      .ab-pill {
        height: 28px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 500;
        border: 1px solid var(--line-strong); background: rgba(255,255,255,0.02); color: var(--text-2);
        display: inline-flex; align-items: center; gap: 5px;
      }
      .ab-pill.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
      .ab-pill:hover:not([disabled]) { color: var(--text); border-color: var(--text-2); }
      .ab-pill[disabled] { opacity: 0.45; cursor: not-allowed; }

      /* ---------- drawer / modals ---------- */
      .scrim { position: fixed; inset: 0; background: var(--overlay); backdrop-filter: blur(4px); z-index: 60; opacity: 0; pointer-events: none; transition: opacity 200ms var(--ease); }
      .scrim.show { opacity: 1; pointer-events: auto; }
      .drawer {
        position: fixed; top: 0; right: 0; bottom: 0; z-index: 70; width: min(440px, 100%);
        background: var(--surface-solid); border-left: 1px solid var(--line-strong);
        transform: translateX(100%); visibility: hidden;
        transition: transform 240ms var(--ease), visibility 0s linear 240ms;
        display: flex; flex-direction: column;
      }
      .drawer.show { transform: translateX(0); visibility: visible; transition: transform 240ms var(--ease); }
      .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--line); }
      .drawer-head h2 { font-size: 20px; }
      .drawer-body { flex: 1; overflow-y: auto; padding: 8px 24px 20px; }
      .drawer-foot { padding: 18px 24px; border-top: 1px solid var(--line); display: grid; gap: 10px; background: rgba(8, 9, 14, 0.5); }
      .cart-row { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: center; }
      .cart-cover { width: 46px; height: 46px; border-radius: 8px; overflow: hidden; flex-shrink: 0; border: 1px solid var(--line); }
      .cart-main { flex: 1; min-width: 0; }
      .cart-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cart-artist { font-size: 12px; color: var(--text-2); }
      .cart-price { font-size: 14px; font-weight: 600; }
      .cart-size-box {
        margin-top: 14px; padding: 12px 14px; border-radius: 10px;
        background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; color: var(--text-2);
      }
      .cart-size-box strong { color: var(--text); }
      .remove-btn { width: 38px; height: 38px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-3); }
      .remove-btn:hover { color: var(--error); background: rgba(255, 143, 128, 0.08); }
      .sum-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-2); }
      .sum-row.total { font-size: 16px; font-weight: 600; color: var(--text); }
      .drawer-empty { padding: 48px 0; text-align: center; color: var(--text-2); font-size: 14px; line-height: 1.6; }

      .seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 4px; gap: 4px; border: 1px solid var(--line); }
      .seg button { flex: 1; height: 34px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--text-2); transition: background-color 150ms var(--ease), color 150ms var(--ease); }
      .seg button.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

      .field { display: grid; gap: 7px; margin-top: 14px; }
      .field label { font-size: 13px; font-weight: 500; color: var(--text-2); }
      .field input {
        height: 44px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line-strong);
        padding: 0 14px; font-size: 15px; color: var(--text); outline: none; width: 100%;
      }
      .field input:focus { border-color: var(--accent); }
      .field .hint { font-size: 12px; color: var(--text-3); }
      .field .err { font-size: 12px; color: var(--error); display: none; }
      .field.invalid input { border-color: var(--error); }
      .field.invalid .err { display: block; }
      .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .secure-note { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text-3); margin-top: 14px; }
      .success-mark { width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; margin: 28px auto 0; }
      .success-title { text-align: center; font-size: 20px; font-weight: 600; margin-top: 18px; }
      .success-sub { text-align: center; font-size: 14px; color: var(--text-2); margin-top: 6px; }
      .order-meta { text-align: center; font-size: 12px; color: var(--text-3); margin-top: 10px; }

      .modal {
        position: fixed; inset: 0; z-index: 70; display: none; align-items: center; justify-content: center; padding: 20px;
        background: var(--overlay); backdrop-filter: blur(5px);
      }
      .modal.show { display: flex; }
      .modal-card {
        background: var(--surface-solid); border: 1px solid var(--line-strong); border-radius: 18px;
        width: 100%; max-width: 460px; max-height: calc(100vh - 40px); overflow-y: auto;
        padding: 28px; position: relative; box-shadow: 0 28px 70px -20px rgba(0,0,0,0.85);
      }
      .modal-card.wide { max-width: 720px; }
      .modal-close { position: absolute; top: 14px; right: 14px; }
      .modal-card h2 { font-size: 24px; padding-right: 40px; }
      .modal-sub { font-size: 14px; color: var(--text-2); margin-top: 6px; }
      .modal-foot { margin-top: 20px; font-size: 14px; color: var(--text-2); text-align: center; }
      .modal-foot button { color: var(--accent); font-weight: 500; padding: 6px 8px; text-decoration: underline; text-underline-offset: 3px; }

      .detail-layout { display: grid; grid-template-columns: 220px 1fr; gap: 26px; }
      .detail-cover { border-radius: 12px; overflow: hidden; aspect-ratio: 1; border: 1px solid var(--line); }
      .fmt-list { display: grid; gap: 8px; margin-top: 18px; }
      .fmt-row { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; cursor: pointer; transition: border-color 150ms var(--ease), background-color 150ms var(--ease); }
      .fmt-row:hover { border-color: var(--line-strong); }
      .fmt-row.selected { border-color: var(--accent); background: var(--accent-soft); }
      .fmt-row input { accent-color: var(--accent); width: 17px; height: 17px; }
      .fmt-name { font-size: 14px; font-weight: 600; }
      .fmt-note { font-size: 12px; color: var(--text-2); }
      .fmt-tag { margin-left: auto; font-size: 12px; color: var(--accent); font-weight: 500; }
      .detail-meta { display: grid; gap: 8px; margin-top: 18px; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
      .detail-meta div { display: flex; justify-content: space-between; gap: 16px; }
      .detail-meta dt { color: var(--text-3); }
      .detail-meta dd { margin: 0; font-weight: 500; text-align: right; }

      .dossier-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
      .dossier-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
      .dossier-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); }
      .dossier-val { font-size: 13px; color: var(--text); margin-top: 4px; font-weight: 500; }
      .dossier-tracks { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
      .dossier-tracks h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }

      .toast {
        position: fixed; left: 24px; bottom: 24px; z-index: 80;
        background: var(--surface-2); border: 1px solid var(--line-strong);
        border-radius: 10px; padding: 12px 16px;
        display: flex; align-items: center; gap: 14px; font-size: 14px;
        opacity: 0; transform: translateY(8px); pointer-events: none;
        transition: opacity 200ms var(--ease), transform 200ms var(--ease);
        max-width: calc(100vw - 48px); box-shadow: 0 14px 36px -12px rgba(0,0,0,0.8);
      }
      .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
      .toast button { color: var(--accent); font-weight: 600; padding: 4px 6px; }

      /* ---------- responsive ---------- */
      @media (max-width: 960px) {
        .grid { grid-template-columns: repeat(3, 1fr); }
        .hero { grid-template-columns: 1fr; gap: 40px; padding-top: 44px; }
        .hero-copy { padding-top: 0; }
        .album-layout { grid-template-columns: 1fr; gap: 32px; }
        .album-cover { max-width: 320px; }
        .footer-grid { grid-template-columns: 1fr 1fr; }
        .calc-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 680px) {
        .wrap { padding: 0 18px; }
        nav.main { display: none; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .steps, .pricing, .dossier-grid { grid-template-columns: 1fr; }
        h1 { font-size: 32px; }
        .cta { flex-direction: column; align-items: flex-start; padding: 28px; }
        .detail-layout { grid-template-columns: 1fr; }
        .detail-cover { max-width: 200px; }
        .player-info { width: auto; flex: 1; }
        .player-tag { display: none; }
        .feature-head { flex-direction: column; }
        .header-in { gap: 14px; }
        .btn-signin-text { display: none; }
        section.block { padding-top: 64px; }
